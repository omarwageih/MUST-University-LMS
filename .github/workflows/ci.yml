name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./LMS_Backend
      - name: Run Tests
        env:
          JWT_SECRET: test_secret
          DB_SERVER: localhost
          DB_NAME: MiniLMS_Test
        run: npm test
        working-directory: ./LMS_Backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./mini-lms-frontend
      - name: Build
        run: npm run build
        working-directory: ./mini-lms-frontend
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./mini-lms-frontend/dist

  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t mini-lms-backend:latest ./LMS_Backend
      - name: Build Frontend Image
        run: docker build -t mini-lms-frontend:latest ./mini-lms-frontend
